*{box-sizing:border-box}body{margin:0;background:#c9b39a;color:#332a24;font-family:system-ui,'Noto Sans TC',sans-serif;overflow:hidden}#view{position:fixed;inset:0}#hud{position:fixed;inset:0;pointer-events:none}.top{position:absolute;top:16px;left:16px;right:16px;display:flex;justify-content:space-between;gap:8px}.pill{background:#eee7dbcc;border:1px solid #88766477;padding:8px 12px;border-radius:30px;font-size:12px;letter-spacing:.08em}.mission{position:absolute;top:62px;left:50%;transform:translateX(-50%);background:#e8deceee;padding:10px 16px;border-radius:4px;text-align:center;min-width:200px;max-width:90vw}.mission b{display:block;font-size:19px;letter-spacing:.12em}.mission small{display:block;margin-top:3px;font-size:11px;opacity:.75}.controls{position:absolute;bottom:20px;left:15px;right:15px;display:flex;justify-content:space-between;align-items:flex-end}.pad{width:128px;height:128px;border-radius:50%;background:#e9e0d566;border:1px solid #fff8;position:relative;pointer-events:auto;touch-action:none}.stick{width:52px;height:52px;border-radius:50%;background:#6b594a99;border:1px solid #ffffff88;position:absolute;left:38px;top:38px}.actions{display:flex;gap:10px;pointer-events:auto}.btn{border:1px solid #fff8;background:#e8decebb;color:#382e26;border-radius:50%;width:65px;height:65px;font-weight:700;font-size:12px;touch-action:none}.btn:active{background:#d3bda4}.overlay{position:fixed;inset:0;background:#d2bea2ee;display:flex;align-items:center;justify-content:center;padding:24px;z-index:5}.panel{max-width:420px;width:100%;background:#eee6d9;border:1px solid #806e5c;padding:26px 24px;text-align:center;box-shadow:0 20px 60px #40302022}.panel h1{font-family:Georgia,serif;font-size:38px;line-height:1;margin:0 0 10px;letter-spacing:.04em}.panel h2{font-size:16px;letter-spacing:.18em;font-weight:500;margin:0 0 18px}.panel p{line-height:1.8;font-size:14px}.panel button{background:#554437;color:#f4eadc;border:0;padding:12px 26px;margin-top:12px;font-size:14px;lett </style></head><body><div id="view"></div><div id="hud"><div class="top"><div class="pill">FRAME FIELD · 3D</div><div class="pill" id="stage">STAGE 01</div></div><div class="mission"><b id="quote">向前走</b><small id="sub">穿越門框</small></div><div class="hint" id="hint">左側移動｜右側拖曳轉向</div><div class="controls"><div class="pad" id="pad"><div class="stick" id="stick"></div></div><div class="actions"><button class="btn" id="turn">轉身</button><button class="btn" id="reset">重來</button></div></div></div>
<div id="victory" class="winScreen hidden"><div class="winCard"><h1>FRAME FIELD</h1><h2>框域 · 通關</h2><p>恭喜你通關了～<br>好好欣賞這次的作品吧～</p><p style="font-size:12px;letter-spacing:.12em;color:#817364">THE END · EXHIBITION SPACE</p><button id="winRestart">重新探索</button></div></div><div class="overlay" id="intro"><div class="panel"><h1>FRAME FIELD</h1><h2>框域_不要反著來</h2><p>你來到一個不斷重複的框架空間。<br>穿越門框，觀察指示，<br>試著找到離開循環的方法。</p><p>左側搖桿移動，拖曳畫面改變視角。</p><button id="start">進入框域</button></div></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script><script>
(()=>{const view=document.getElementById('view');if(!window.THREE){document.getElementById('quote').textContent='3D載入中';return;}const scene=new THREE.Scene();scene.background=new THREE.Color(0xc7b194);scene.fog=new THREE.Fog(0xc7b194,22,100);const camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.1,180);camera.position.set(0,1.65,3);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.8));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;view.appendChild(renderer.domElement);scene.add(new THREE.HemisphereLight(0xffffff,0x5b4938,2));const sun=new THREE.DirectionalLight(0xffe4bf,2.1);sun.position.set(-7,12,5);sun.castShadow=true;scene.add(sun);
const mats={frame:new THREE.MeshStandardMaterial({color:0x3c3028,roughness:.72}),wood:new THREE.MeshStandardMaterial({color:0x8c684a,roughness:.75}),floor:new THREE.MeshStandardMaterial({color:0xd8c4a8,roughness:1}),light:new THREE.MeshStandardMaterial({color:0xe9dfcd,roughness:1}),dark:new THREE.MeshStandardMaterial({color:0x39332e,roughness:1}),white:new THREE.MeshStandardMaterial({color:0xf1eee8,roughness:1})};let zone=1,gateCount=0,loop=0,player={x:0,z:2,yaw:0},lookPitch=0,started=false;const gateGroups=[];
function box(x,y,z,w,h,d,mat){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;scene.add(m);return m}
function frame(x,z,angle=0,scale=1,material=mats.frame){const group=new THREE.Group();const t=.14*scale,w=2.8*scale,h=3.4*scale;for(const [px,py,pz,sx,sy,sz] of [[-w/2, h/2,0,t,h,t],[w/2,h/2,0,t,h,t],[0,h,0,w,t,t],[0,0,0,w,t,t]]){const p=new THREE.Mesh(new THREE.BoxGeometry(sx,sy,sz),material);p.position.set(px,py,pz);p.castShadow=true;group.add(p)}group.position.set(x,0,z);group.rotation.y=angle;group.userData.world=true;scene.add(group);return group}
function clearWorld(){for(const o of [...scene.children])if(o.userData.world)scene.remove(o);gateGroups.splice(0)}
function addWorld(o){o.userData.world=true;scene.add(o);return o}
function floorPlane(color){const m=new THREE.Mesh(new THREE.PlaneGeometry(160,160),new THREE.MeshStandardMaterial({color,roughness:1}));m.rotation.x=-Math.PI/2;m.position.y=-.03;m.receiveShadow=true;addWorld(m)}
function makeCorridor(stage){clearWorld();if(stage===1){floorPlane(0xcab296);for(let i=0;i<12;i++){let z=-i*5.3;let g=new THREE.Group();const t=.13,w=3.1,h=3.5;for(const [x,y,sx,sy] of [[-w/2,h/2,t,h],[w/2,h/2,t,h],[0,h,w,t],[0,0,w,t]]){const p=new THREE.Mesh(new THREE.BoxGeometry(sx,sy,.13),mats.frame);p.position.set(x,y,0);g.add(p)}g.position.z=z;addWorld(g);gateGroups.push(g)} }
else{
// Two distinct rooms: bright room on left, dark room on right.
scene.background=new THREE.Color(0x252321);scene.fog=new THREE.Fog(0x252321,32,100);
const floorGeo=new THREE.PlaneGeometry(7.2,36);const brightFloor=new THREE.Mesh(floorGeo,new THREE.MeshStandardMaterial({color:0xe9e4dc,roughness:1}));brightFloor.rotation.x=-Math.PI/2;brightFloor.position.set(-3.6,0,-17);brightFloor.receiveShadow=true;addWorld(brightFloor);
const darkFloor=new THREE.Mesh(new THREE.PlaneGeometry(7.2,36),new THREE.MeshStandardMaterial({color:0x242322,roughness:1}));darkFloor.rotation.x=-Math.PI/2;darkFloor.position.set(3.6,0,-17);darkFloor.receiveShadow=true;addWorld(darkFloor);
// outer walls and a central divider make the two room volumes readable
const lightWall=new THREE.MeshStandardMaterial({color:0xf1eee8,roughness:1});const darkWall=new THREE.MeshStandardMaterial({color:0x171615,roughness:1});
box(-7.2,2.4,-17,.22,4.8,36,lightWall).userData.world=true;box(7.2,2.4,-17,.22,4.8,36,darkWall).userData.world=true;
box(-3.6,2.4,-35,7.2,4.8,.22,lightWall).userData.world=true;box(3.6,2.4,-35,7.2,4.8,.22,darkWall).userData.world=true;
// divider starts after the entry, so the player can choose left/right
box(0,2.4,-19, .18,4.8,30,new THREE.MeshStandardMaterial({color:0x88837a})).userData.world=true;
const brightLamp=new THREE.PointLight(0xfff2dd,100,32,2);brightLamp.position.set(-3.5,4,-10);addWorld(brightLamp);
const darkLamp=new THREE.PointLight(0x383838,1.3,18,2);darkLamp.position.set(3.5,3,-12);addWorld(darkLamp);
const fill=new THREE.HemisphereLight(0x777777,0x111111,.22);addWorld(fill);
// five distinct tilted frame thresholds in each room
for(let i=0;i<5;i++){let z=-i*5.2-2;frame(-3.6,z,(i%2?-.25:.2),.95,mats.wood);frame(3.6,z,(i%2?.38:-.32),.95,new THREE.MeshStandardMaterial({color:0x554b40,roughness:.9}));}
// portal frames at the end of both rooms
frame(-3.6,-32,.08,1.25,new THREE.MeshStandardMaterial({color:0xc5b9a8,emissive:0x66594b,emissiveIntensity:.2}));frame(3.6,-32,-.08,1.25,new THREE.MeshStandardMaterial({color:0x111111,emissive:0x222222,emissiveIntensity:.25}));
}
}
function setUI(q,s,stage){document.getElementById('quote').textContent=q;document.getElementById('sub').textContent=s;document.getElementById('stage').textContent='STAGE 0'+stage}
function resetFirst(){zone=1;gateCount=0;loop=0;player={x:0,z:2,yaw:0};lookPitch=0;camera.position.set(0,1.65,2);scene.background=new THREE.Color(0xc7b194);scene.fog=new THREE.Fog(0xc7b194,22,100);makeCorridor(1);setUI('向前走','穿越門框',1);document.getElementById('victory').classList.add('hidden')}
function enterSecond(){zone=2;gateCount=0;player={x:0,z:2,yaw:0};makeCorridor(2);setUI('不要走在黑暗下','左側亮房｜右側暗房，選擇你的路',2)}
function endRoom(){zone=3;clearWorld();scene.background=new THREE.Color(0xf3f2ef);scene.fog=new THREE.Fog(0xf3f2ef,30,100);floorPlane(0xf4f3f0);const wallMat=new THREE.MeshStandardMaterial({color:0xffffff,roughness:1});box(0,4,-12,22,8,.2,wallMat);box(-11,4,-2,.2,8,20,wallMat);box(11,4,-2,.2,8,20,wallMat);box(0,8,-2,22,.2,20,wallMat);box(0,0,-2,22,.2,20,wallMat);
// poster-like panel on far wall
const panel=box(0,3.2,-11.65,4.2,6.1,.08,new THREE.MeshStandardMaterial({color:0xc6ae91}));panel.userData.world=true;const title=makeTextPanel();title.position.set(0,3.5,-11.58);addWorld(title);player={x:0,z:1.8,yaw:0};camera.position.set(0,1.65,1.8);setUI('通關','好好欣賞作品',3);document.getElementById('hint').textContent='滑動畫面，欣賞展覽空間';document.getElementById('victory').classList.remove('hidden')}
function makeTextPanel(){const c=document.createElement('canvas');c.width=512;c.height=768;const ctx=c.getContext('2d');ctx.fillStyle='#c6ae91';ctx.fillRect(0,0,512,768);ctx.strokeStyle='#7a6049';ctx.lineWidth=2;ctx.strokeRect(28,28,456,712);ctx.fillStyle='#564437';ctx.textAlign='center';ctx.font='24px serif';ctx.fillText('框域｜校慶木構實作展',256,82);ctx.font='96px Georgia';ctx.fillText('FRAME',256,225);ctx.fillText('FIELD',256,585);ctx.font='23px serif';ctx.fillText('School Anniversary Timber',256,680);ctx.fillText('Construction Exhibition 2026',256,714);const tex=new THREE.CanvasTexture(c);const mesh=new THREE.Mesh(new THREE.PlaneGeometry(4.2,6.1),new THREE.MeshBasicMaterial({map:tex}));return mesh}
const move={f:0,s:0};let pad=document.getElementById('pad'),stick=document.getElementById('stick'),dragPad=false;function padPos(e){const r=pad.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=e.clientX-cx,dy=e.clientY-cy,len=Math.hypot(dx,dy),max=38;if(len>max){dx=dx/len*max;dy=dy/len*max}stick.style.left=(38+dx)+'px';stick.style.top=(38+dy)+'px';move.s=dx/max;move.f=-dy/max}pad.addEventListener('pointerdown',e=>{dragPad=true;pad.setPointerCapture(e.pointerId);padPos(e)});pad.addEventListener('pointermove',e=>{if(dragPad)padPos(e)});['pointerup','pointercancel'].forEach(ev=>pad.addEventListener(ev,()=>{dragPad=false;move.f=move.s=0;stick.style.left='38px';stick.style.top='38px'}));let dragging=false,lastX=0,lastY=0;renderer.domElement.addEventListener('pointerdown',e=>{dragging=true;lastX=e.clientX;lastY=e.clientY;renderer.domElement.setPointerCapture(e.pointerId)});renderer.domElement.addEventListener('pointermove',e=>{if(!dragging)return;player.yaw-=(e.clientX-lastX)*.006;lookPitch=Math.max(-.6,Math.min(.6,lookPitch+(e.clientY-lastY)*.004));lastX=e.clientX;lastY=e.clientY});['pointerup','pointercancel'].forEach(ev=>renderer.domElement.addEventListener(ev,()=>dragging=false));
document.getElementById('turn').onclick=()=>{player.yaw+=Math.PI};document.getElementById('reset').onclick=()=>{resetFirst();scene.background=new THREE.Color(0xc7b194);scene.fog=new THREE.Fog(0xc7b194,22,100)};document.getElementById('start').onclick=()=>{document.getElementById('intro').classList.add('hidden');started=true;resetFirst()};document.getElementById('winRestart').onclick=()=>{document.getElementById('victory').classList.add('hidden');resetFirst()};
let lastZ=player.z;function update(dt){if(!started)return;const speed=3.5;let f=move.f,s=move.s;const vx=Math.sin(player.yaw)*f+Math.cos(player.yaw)*s;const vz=-Math.cos(player.yaw)*f+Math.sin(player.yaw)*s;player.x+=vx*speed*dt;player.z+=vz*speed*dt;player.x=Math.max(-7,Math.min(7,player.x));
if(zone===1){if(player.z< -26){if(gateCount<5){gateCount=5;setUI('不要回頭','繼續向前，你會一直遇見相同的門框',1)}if(player.z< -32){player.z=2;loop++;gateCount=0;setUI('不要回頭','循環 '+loop+' · 門框再次出現',1)}}if(player.z>1.4&&player.yaw>Math.PI*.65&&player.yaw<Math.PI*1.35){enterSecond()}}
else if(zone===2){if(player.z< -33){let lane=player.x>0?'dark':'light';if(lane==='light'){zone=1;loop=0;player={x:0,z:2,yaw:0};scene.background=new THREE.Color(0xc7b194);scene.fog=new THREE.Fog(0xc7b194,22,100);makeCorridor(1);setUI('回到起點','光亮之路將你帶回第一關',1)}else endRoom()}}
}
function animate(){requestAnimationFrame(animate);const dt=Math.min(.05,clock.getDelta());update(dt);if(zone===3){camera.position.x=player.x;camera.position.z=player.z;camera.position.y=1.65;camera.rotation.order='YXZ';camera.rotation.y=player.yaw;camera.rotation.x=lookPitch}else{camera.position.set(player.x,1.65,player.z);camera.rotation.order='YXZ';camera.rotation.y=player.yaw;camera.rotation.x=lookPitch}renderer.render(scene,camera)}const clock=new THREE.Clock();resetFirst();animate();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
})();</script></body></html>
